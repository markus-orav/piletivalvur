name: Piletivalvur

on:
  schedule:
    # iga 5 min (GitHub võib ajastatud töid koormuse tõttu hilinemisega käivitada)
    - cron: "*/5 * * * *"
  workflow_dispatch:
    inputs:
      test:
        description: "Saada ainult proovitekst telefoni"
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: piletivalvur
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      TZ: Europe/Tallinn
      PILETIVALVUR_CONFIG: config.cloud.json
      PILETIVALVUR_NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
    steps:
      - uses: actions/checkout@v4

      - name: Proovitekst
        if: ${{ inputs.test }}
        run: python3 piletivalvur.py --test

      - name: Kontrolli mängukava ja uudiseid
        if: ${{ !inputs.test }}
        run: python3 piletivalvur.py

      # Seis salvestatakse reposse ainult siis, kui midagi peale kontrolli aja muutus.
      # Need commitid hoiavad ka ära, et GitHub ajastust 60 päeva vaikuse järel välja ei lülitaks.
      - name: Salvesta seis
        if: ${{ !inputs.test }}
        run: |
          if git ls-files --error-unmatch state.json >/dev/null 2>&1 && git diff --quiet -I '"last_check"' -- state.json; then
            echo "Muutusi pole"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add state.json
          git commit -m "Seis $(date +'%Y-%m-%d %H:%M')"
          git push
